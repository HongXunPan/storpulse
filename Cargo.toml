[workspace]
members = [
  "crates/storpulse-core",
  "crates/storpulse-ffi",
  "platform/windows/storpulse-windows-service",
  "platform/windows/storpulse-windows-service-contract",
  "platform/windows/storpulse-windows-service-runtime",
  "platform/windows/storpulse-windows-probe",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/HongXunPan/storpulse"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
storpulse-core = { path = "crates/storpulse-core" }
windows-sys = "0.61.2"
